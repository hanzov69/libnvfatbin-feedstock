{% set name = "libnvfatbin" %}
{% set version = "13.4.49" %}
{% set cuda_version = "13.4" %}
{% set platform = "linux-x86_64" %}  # [linux64]
{% set platform = "linux-ppc64le" %}  # [ppc64le]
{% set platform = "linux-sbsa" %}  # [aarch64]
{% set platform = "windows-x86_64" %}  # [win64]
{% set platform = "windows-arm64" %}  # [win and arm64]
{% set target_name = "x86_64-linux" %}  # [linux64]
{% set target_name = "ppc64le-linux" %}  # [ppc64le]
{% set target_name = "sbsa-linux" %}  # [aarch64]
{% set target_name = "x64" %}  # [win64]
{% set target_name = "arm64" %}  # [win and arm64]
{% set extension = "tar.xz" %}  # [not win]
{% set extension = "zip" %}  # [win]
{% set sha256 = "83774b25cd54caefae9e9e1e9d7007d18589ee81a11565dc7cafcd12c6114dba" %}  # [linux64]
{% set sha256 = "7c357a4bf4ec67ed76e26957b5fec3ed8908191f4acedd3bdf323b66a093e190" %}  # [aarch64]
{% set sha256 = "831af09019e56b54bc4d4364a0cf7947c688acb05e186a52f8c73662cbeb4a42" %}  # [win64]
{% set sha256 = "051f45e597a595b474f39b7cf82872cfefdba80d762cfa57ae9ed9f36d7d3d86" %}  # [win and arm64]

package:
  name: {{ name|lower }}-split
  version: {{ version }}

source:
  url: https://developer.download.nvidia.com/compute/cuda/redist/{{ name }}/{{ platform }}/{{ name }}-{{ platform }}-{{ version }}-archive.{{ extension }}
  sha256: {{ sha256 }}

build:
  number: 0
  skip: true  # [osx or ppc64le]

requirements:
  build:
    - cf-nvidia-tools 1.*  # [linux]
    - patchelf <0.18.0                      # [linux]

outputs:
  - name: libnvfatbin
    build:
      binary_relocation: false
    files:
      - lib/libnvfatbin.so.*                             # [linux]
      - targets/{{ target_name }}/lib/libnvfatbin*.so.*  # [linux]
      - Library\bin\nvfatbin*.dll      # [win]
    requirements:
      build:
        - {{ compiler("c") }}
        - {{ compiler("cxx") }}
        - arm-variant * {{ arm_variant_type }}  # [aarch64]
        - {{ stdlib("c") }}
      host:
        - cuda-version {{ cuda_version }}
      run:
        - {{ pin_compatible("cuda-version", max_pin="x.x") }}
      run_constrained:
        - arm-variant * {{ arm_variant_type }}  # [aarch64]
    test:
      requires:
        - patchelf  # [linux]
      files:
        - test-rpath.sh
      commands:
        - test -L $PREFIX/lib/libnvfatbin.so.{{ version }}                                          # [linux]
        - test -L $PREFIX/lib/libnvfatbin.so.{{ version.split(".")[0] }}                            # [linux]
        - test -L $PREFIX/targets/{{ target_name }}/lib/libnvfatbin.so.{{ version.split(".")[0] }}  # [linux]
        - test -f $PREFIX/targets/{{ target_name }}/lib/libnvfatbin.so.{{ version }}                # [linux]
        - bash test-rpath.sh                                                                        # [linux]
        - if not exist %LIBRARY_BIN%\nvfatbin*.dll exit 1                         # [win]
    about:
      home: https://developer.nvidia.com/cuda-toolkit
      license_file: LICENSE
      license: LicenseRef-NVIDIA-End-User-License-Agreement
      license_url: https://docs.nvidia.com/cuda/eula/index.html
      summary: NVIDIA compiler library for fatbin interaction
      description: |
        NVIDIA compiler library for fatbin interaction
      doc_url: https://docs.nvidia.com/cuda/index.html

  - name: libnvfatbin-dev
    build:
      run_exports:
        - {{ pin_subpackage("libnvfatbin", max_pin="x") }}
    files:
      - lib/libnvfatbin.so         # [linux]
      - lib/pkgconfig                                 # [linux]
      - targets/{{ target_name }}/include             # [linux]
      - targets/{{ target_name }}/lib/libnvfatbin.so  # [linux]
      - targets/{{ target_name }}/lib/stubs           # [linux]
      - Library\include                               # [win]
      - Library\lib\{{ target_name }}                 # [win]
    requirements:
      build:
        - {{ compiler("c") }}
        - {{ compiler("cxx") }}
        - arm-variant * {{ arm_variant_type }}  # [aarch64]
        - {{ stdlib("c") }}
      host:
        - cuda-version {{ cuda_version }}
      run:
        - {{ pin_compatible("cuda-version", max_pin="x.x") }}
        - {{ pin_subpackage("libnvfatbin", exact=True) }}
      run_constrained:
        - arm-variant * {{ arm_variant_type }}  # [aarch64]
        - libnvfatbin-static >={{ version }}
    test:
      commands:
        - test -L $PREFIX/lib/libnvfatbin.so                                  # [linux]
        - test -f $PREFIX/lib/pkgconfig/nvfatbin*.pc                          # [linux]
        - test -f $PREFIX/targets/{{ target_name }}/include/nvFatbin.h        # [linux]
        - test -L $PREFIX/targets/{{ target_name }}/lib/libnvfatbin.so        # [linux]
        - test -f $PREFIX/targets/{{ target_name }}/lib/stubs/libnvfatbin.so  # [linux]
        - if not exist %LIBRARY_INC%\nvFatbin.h exit 1                        # [win]
        - if not exist %LIBRARY_LIB%\{{ target_name }}\nvfatbin.lib exit 1    # [win]
    about:
      home: https://developer.nvidia.com/cuda-toolkit
      license_file: LICENSE
      license: LicenseRef-NVIDIA-End-User-License-Agreement
      license_url: https://docs.nvidia.com/cuda/eula/index.html
      summary: NVIDIA compiler library for fatbin interaction
      description: |
        NVIDIA compiler library for fatbin interaction
      doc_url: https://docs.nvidia.com/cuda/index.html

  - name: libnvfatbin-static
    files:
      - targets/{{ target_name }}/lib/libnvfatbin_static.a  # [linux]
      - Library\lib\{{ target_name }}\nvfatbin_static.lib                 # [win]
    requirements:
      build:
        - {{ compiler("c") }}
        - {{ compiler("cxx") }}
        - arm-variant * {{ arm_variant_type }}  # [aarch64]
        - {{ stdlib("c") }}
      host:
        - cuda-version {{ cuda_version }}
      run:
        - {{ pin_compatible("cuda-version", max_pin="x.x") }}
      run_constrained:
        - arm-variant * {{ arm_variant_type }}  # [aarch64]
    test:
      commands:
        - test -f $PREFIX/targets/{{ target_name }}/lib/libnvfatbin_static.a  # [linux]
        - if not exist %LIBRARY_LIB%\{{ target_name }}\nvfatbin_static.lib exit 1           # [win]
    about:
      home: https://developer.nvidia.com/cuda-toolkit
      license_file: LICENSE
      license: LicenseRef-NVIDIA-End-User-License-Agreement
      license_url: https://docs.nvidia.com/cuda/eula/index.html
      summary: NVIDIA compiler library for fatbin interaction
      description: |
        NVIDIA compiler library for fatbin interaction
      doc_url: https://docs.nvidia.com/cuda/index.html

about:
  home: https://developer.nvidia.com/cuda-toolkit
  license_file: LICENSE
  license: LicenseRef-NVIDIA-End-User-License-Agreement
  license_url: https://docs.nvidia.com/cuda/eula/index.html
  summary: NVIDIA compiler library for fatbin interaction
  description: |
    NVIDIA compiler library for fatbin interaction
  doc_url: https://docs.nvidia.com/cuda/index.html

extra:
  feedstock-name: libnvfatbin
  recipe-maintainers:
    - conda-forge/cuda
